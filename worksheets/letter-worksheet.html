<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>דף פעילות — כוכבות קוראות</title>
<style>
@font-face{font-family:'School Print Hebrew';src:url('../assets/fonts/noto-sans-hebrew.woff2') format('woff2');font-weight:100 900}
@page{size:A4;margin:12mm}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#000;background:#eee}.sheet{width:210mm;min-height:297mm;margin:10px auto;background:#fff;padding:13mm 15mm}.top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:6mm}.top h1{font-size:29px;margin:0}.top img{height:22mm;margin-inline-start:6mm;vertical-align:middle}.name{font-size:15px;border-bottom:1px solid #000;min-width:55mm;padding-bottom:3px}.instruction{font-size:16px;font-weight:bold;margin:6mm 0 3mm}.print-letter{font-family:'School Print Hebrew',Arial,sans-serif}.demo{display:grid;grid-template-columns:38mm 1fr;gap:8mm;align-items:center;border:1.5px solid #000;padding:5mm}.big{font-size:92px;font-weight:600;text-align:center;line-height:1}.guide{font-size:15px;line-height:1.55}.trace-row,.free-row{display:flex;direction:rtl;gap:7mm;border-bottom:1px solid #777;padding:2mm 3mm 4mm;margin-bottom:3mm;height:24mm;align-items:center}.trace-letter{font-size:57px;font-weight:600;color:#bbb;line-height:1}.free-box{height:19mm;flex:1;border-right:1px dashed #aaa}.bank{display:grid;grid-template-columns:repeat(8,1fr);gap:4mm;direction:rtl}.bank span{height:16mm;border:1.5px solid #000;display:grid;place-items:center;font-size:31px;font-weight:600}.pics{display:grid;grid-template-columns:repeat(6,1fr);gap:3mm}.pics div{border:1.5px solid #000;border-radius:4mm;height:28mm;display:grid;place-items:center}.pics img{max-width:80%;max-height:24mm;filter:grayscale(1) contrast(1.15)}.footer{display:flex;justify-content:space-between;margin-top:6mm;font-size:12px}.print{position:fixed;left:18px;bottom:18px;border:2px solid #000;background:#fff;padding:10px 16px;border-radius:8px;font-weight:bold;cursor:pointer}@media print{body{background:#fff}.sheet{margin:0;padding:8mm 11mm;width:auto;min-height:auto}.print{display:none}}@media(max-width:800px){.sheet{width:100%;margin:0;padding:8mm}.bank{grid-template-columns:repeat(6,1fr)}.pics{grid-template-columns:repeat(3,1fr)}}
</style></head>
<body><main class="sheet" id="sheet"></main><button class="print" onclick="print()">הדפסה</button>
<script>
const SHEETS={

 'ל':{item:'לב',img:'items/heart.png',pics:[['לימון','words/limon.png'],['תוף','words/tof.png'],['לחם','words/lechem.png'],['שמש','words/shemesh.png'],['לב','words/lev.png'],['מפתח','words/mafteach.png']],bank:'לרלדולזכלבנלמת'},
 'נ':{item:'נעליים',img:'items/boots.png',pics:[['נר','words/ner.png'],['כדור','words/kadur.png'],['נוצה','words/notza.png'],['פרח','words/perach.png'],['נחש','words/nachash.png'],['מראה','words/mara.png']],bank:'נגנכבנוזנרדנלמ'},
 'ס':{item:'סיכה',img:'items/pin.png',pics:[['ספר','words/sefer.png'],['תוף','words/tof.png'],['סירה','words/sira.png'],['פרח','words/perach.png'],['סוכרייה','words/sukariya.png'],['מטרייה','words/mitriya.png']],bank:'סטסושסמעססהתסב'},

 'ח':{item:'חצאית',img:'items/skirt.png',pics:[['חלון','words/chalon.png'],['שמש','words/shemesh.png'],['חתול','words/chatul.png'],['תוף','words/tof.png'],['חלב','words/chalav.png'],['מראה','words/mara.png']],bank:'חהחתרחדוחכבחמנ'},
 'ת':{item:'תופים',img:'stage/drums.png',pics:[['תפוח','words/tapuach.png'],['כדור','words/kadur.png'],['תות','words/tut.png'],['פרח','words/perach.png'],['תיק','words/tik.png'],['נר','words/ner.png']],bank:'תחתהרתדכתבנתמו'},
 'ג':{item:'גיטרה',img:'stage/guitar.png',pics:[['גלידה','words/glida.png'],['שמש','words/shemesh.png'],['גמל','words/gamal.png'],['לימון','words/limon.png'],['גזר','words/gezer.png'],['צב','words/tzav.png']],bank:'גנגזורגדכגבפגל'},
 'ק':{item:'קהל',img:'stage/audience.png',pics:[['קוף','words/koof.png'],['שמש','words/shemesh.png'],['קשת','words/keshet.png'],['פרח','words/perach.png'],['קקטוס','words/kaktus.png'],['סירה','words/sira.png']],bank:'קהקחרקפלקתוקדה'},
 'ז':{item:'זיקוקים',img:'stage/fireworks.png',pics:[['זברה','words/zebra.png'],['מפתח','words/mafteach.png'],['זר פרחים','words/zer.png'],['ספר','words/sefer.png'],['זית','words/zayit.png'],['חתול','words/chatul.png']],bank:'זוזןרזדגזניזטל'},
 'ר':{item:'רמקול',img:'stage/speaker.png',pics:[['רכבת','words/rakevet.png'],['לימון','words/limon.png'],['רימון','words/rimon.png'],['כדור','words/kadur.png'],['רובוט','words/robot.png'],['ציפור','words/tzipor.png']],bank:'רדרךהרוזרכבחרת'},
 'ד':{item:'דלת',img:'room/door.png',pics:[['דג','words/dag.png'],['כדור','words/kadur.png'],['דבורה','words/dvora.png'],['פרח','words/perach.png'],['דובי','words/dubi.png'],['נר','words/ner.png']],bank:'דרדךהדוזדכבדחת'},
 'ו':{item:'וילון',img:'room/curtain.png',pics:[['ורד','words/vered.png'],['כדור','words/kadur.png'],['ופל','words/vafel.png'],['שמש','words/shemesh.png'],['וטרינרית','words/veterinarit.png'],['צב','words/tzav.png']],bank:'וזוןיורדונגוטל'},
 'ט':{item:'טלוויזיה',img:'room/tv.png',pics:[['טלפון','words/telefon.png'],['שמש','words/shemesh.png'],['טרקטור','words/traktor.png'],['פרח','words/perach.png'],['טווס','words/tavas.png'],['לימון','words/limon.png']],bank:'טמטשעטצסטבנטתה'},
 'י':{item:'ירקות',img:'food/vegetables.png',pics:[['יונה','words/yona.png'],['כדור','words/kadur.png'],['ינשוף','words/yanshuf.png'],['פרח','words/perach.png'],['ילקוט','words/yalkut.png'],['שמש','words/shemesh.png']],bank:'יויזןירידנגיט'},
 'ה':{item:'המבורגר',img:'food/hamburger.png',pics:[['הר','words/har.png'],['כדור','words/kadur.png'],['היפופוטם','words/hipopotam.png'],['סירה','words/sira.png'],['הליקופטר','words/helikopter.png'],['לימון','words/limon.png']],bank:'החהתרהדכהקבהפו'},
 'א':{item:'ארטיק',img:'food/popsicle.png',pics:[['אריה','words/arye.png'],['שמש','words/shemesh.png'],['אבטיח','words/avatiach.png'],['כדור','words/kadur.png'],['אוטובוס','words/otobus.png'],['צב','words/tzav.png']],bank:'אעאצטאמשאגנאבס'},
 'ע':{item:'עגילים',img:'gifts/earrings.png',pics:[['עוגה','words/uga.png'],['כדור','words/kadur.png'],['עכבר','words/achbar.png'],['פרח','words/perach.png'],['ענן','words/anan.png'],['סירה','words/sira.png']],bank:'עצעשטעמאעגנעבס'},
 'ב':{item:'בלון',img:'gifts/balloon.png',pics:[['בננה','words/banana.png'],['כדור','words/kadur.png'],['ברווז','words/barvaz.png'],['שמש','words/shemesh.png'],['בית','words/bayit.png'],['לימון','words/limon.png']],bank:'בכבנגבפמבררבדת'},
 'פ':{item:'פרח',img:'gifts/flower.png',pics:[['פיל','words/pil.png'],['כדור','words/kadur.png'],['פרפר','words/parpar.png'],['שמש','words/shemesh.png'],['פינגווין','words/pinguin.png'],['סירה','words/sira.png']],bank:'פבפכרפדהפקספונ'},
 'כ':{item:'כובע',img:'gifts/hat.png',pics:[['כוכב','words/kochav.png'],['שמש','words/shemesh.png'],['כלב','words/kelev.png'],['פרח','words/perach.png'],['כוס','words/kos.png'],['סירה','words/sira.png']],bank:'כבכנפכגמכרדכתק'}
};
const l=new URLSearchParams(location.search).get('l'),d=SHEETS[l]||SHEETS['מ'],L=SHEETS[l]?l:'מ';
document.title=`דף פעילות — האות ${L}׳`;
const rep=(html,n)=>Array.from({length:n},()=>html).join('');
document.getElementById('sheet').innerHTML=`
<header class="top"><div><h1>מתרגלות את האות ${L}׳ <img src="../assets/${d.img}" alt=""></h1><div>${L}ְ־${L}ְ־${d.item}</div></div><div class="name">שם: __________________</div></header>
<div class="instruction">1. עוברות על האות באצבע ואחר כך בעיפרון</div>
<section class="demo"><div class="big print-letter">${L}</div><div class="guide">אומרות יחד: ${L}ְ־${L}ְ־${d.item}.<br>מתחילות מלמעלה וכותבות לאט.<br><b>חשוב יותר לכתוב בנחת מאשר לכתוב מושלם.</b></div></section>
<div class="instruction">2. עוברות על האותיות האפורות</div>
<div class="trace-row">${rep(`<span class="trace-letter print-letter">${L}</span>`,6)}</div>
<div class="instruction">3. כותבות לבד</div>
<div class="free-row">${rep('<span class="free-box"></span>',5)}</div>
<div class="instruction">4. מקיפות את כל האותיות ${L}׳</div>
<div class="bank">${[...d.bank].map(x=>`<span class="print-letter">${x}</span>`).join('')}</div>
<div class="instruction">5. צובעות רק את התמונות שמתחילות בצליל ${L}ְ</div>
<div class="pics">${d.pics.map(([w,src])=>`<div><img src="../assets/${src}" alt="${w}"></div>`).join('')}</div>
<footer class="footer"><span>טיפ להורים: אמרו יחד את שם כל תמונה והקשיבו לצליל הראשון, בלי לבקש מהילדה לאיית.</span><span>כוכבות קוראות</span></footer>`;
</script></body></html>
