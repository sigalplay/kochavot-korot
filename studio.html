<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>אולפן הקלטות</title>
<style>
@font-face{font-family:'Playful Hebrew';src:url('assets/fonts/playpen-sans-hebrew.woff2') format('woff2');font-weight:100 900}
body{margin:0;font-family:'Playful Hebrew',Arial,sans-serif;background:#fbf2f7;color:#5b4468}
header{position:sticky;top:0;background:#fffaf6;box-shadow:0 4px 16px #8d5f9f22;padding:16px 22px;z-index:2}
h1{margin:0;font-size:30px;color:#8b5fa0}
header p{margin:6px 0 0;line-height:1.5}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.filters button{border:0;border-radius:999px;padding:8px 16px;background:#f2e3ef;font:inherit;cursor:pointer}
.filters button.on{background:#a76a9c;color:#fff}
main{max-width:980px;margin:0 auto;padding:16px}
.line{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:12px 16px;margin:10px 0;box-shadow:0 4px 12px #8d5f9f18}
.line .t{flex:1;font-size:22px;line-height:1.4}
.line small{display:block;color:#a08aa8;font-size:13px;direction:ltr;text-align:right}
.line button{border:0;border-radius:999px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;background:#f2e3ef}
.rec{background:#e86f95!important;color:#fff}
.rec.on{animation:p 1s infinite}
.has{box-shadow:inset 0 0 0 3px #66b99e}
.count{font-weight:800}
@keyframes p{50%{opacity:.5}}
</style>
</head>
<body>
<header><h1>אולפן הקלטות — כוכבות קוראות</h1>
<p>לחצי <b>הקלטה</b>, אמרי את המשפט, ולחצי <b>עצירה</b>. ההקלטה נשמרת במכשיר הזה, והמשחק משתמש בה במקום בקול הממוחשב.<br>
טיפ: בצלילים (למשל „מְ”) אומרים רק את הצליל הקצר, בלי שם האות. הוקלטו <span class="count" id="count">0</span> מתוך <span id="total"></span>.</p>
<div class="filters" id="filters"></div></header>
<main id="list"></main>
<script src="js/content.js"></script>
<script src="js/audio.js"></script>
<script>
const groups={'הכול':()=>true,'הוראות':id=>/^(open|words|hunt|write|write2|done|yes)-/.test(id),'מילים ופריטים':id=>/^(w|i)-/.test(id),'אותיות וצלילים':id=>/^(name|sound|letter)-/.test(id),'כללי':id=>!/^(open|words|hunt|write|write2|done|yes|name|sound|w|i|letter)-/.test(id)};
let filter='הכול',have=new Set(),rec=null;
async function refresh(){have=new Set(await Voice.listClips()||[]);document.getElementById('count').textContent=[...have].filter(k=>LINES[k]).length;render()}
function render(){
  document.getElementById('total').textContent=Object.keys(LINES).length;
  document.getElementById('filters').innerHTML=Object.keys(groups).map(g=>`<button class="${g===filter?'on':''}" onclick="filter='${g}';render()">${g}</button>`).join('');
  document.getElementById('list').innerHTML=Object.entries(LINES).filter(([id])=>groups[filter](id)).map(([id,[text]])=>`<div class="line ${have.has(id)?'has':''}" id="L-${id}"><div class="t">${text}<small>${id}</small></div>
   <button class="rec" onclick="toggle('${id}',this)">הקלטה</button>${have.has(id)?`<button onclick="play('${id}')">▶ השמעה</button><button onclick="download('${id}')">הורדה</button><button onclick="del('${id}')">מחיקה</button>`:`<button onclick="Voice.say('${id}')">▶ קול ממוחשב</button>`}</div>`).join('');
}
async function toggle(id,btn){
  if(rec){rec.stop();return}
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch{alert('אין גישה למיקרופון');return}
  const chunks=[],r=new MediaRecorder(stream);rec=r;btn.classList.add('on');btn.textContent='עצירה';
  r.ondataavailable=e=>chunks.push(e.data);
  r.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());rec=null;await Voice.putClip(id,new Blob(chunks,{type:r.mimeType||'audio/webm'}));await refresh();play(id)};
  r.start();
}
async function play(id){const b=await Voice.getClip(id);if(b){const u=URL.createObjectURL(b);await Voice.playUrl(u);URL.revokeObjectURL(u)}}
async function del(id){await Voice.delClip(id);refresh()}
async function download(id){const b=await Voice.getClip(id);if(!b)return;const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=id+(b.type.includes('mp4')?'.m4a':'.webm');a.click()}
Voice.ready().then(refresh);
</script>
</body></html>
